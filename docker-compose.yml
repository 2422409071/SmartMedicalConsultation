# ============================================================
# 智能医疗问诊助手 - Docker Compose 编排文件
# ============================================================
# 用法：
#   启动：  docker-compose up -d
#   停止：  docker-compose stop
#   查看：  docker-compose ps
#   日志：  docker-compose logs -f neo4j
#   销毁：  docker-compose down        （删除容器，保留数据卷）
#   清空：  docker-compose down -v     （删除容器 + 数据卷，慎用！）
#
# 说明：
#   - 本项目采用单进程部署：FastAPI 同时托管 API 与 Vue 前端静态文件，
#     因此唯一需要容器化的基础设施是 Neo4j 图数据库。
#   - Neo4j Web UI:  http://localhost:7474  (neo4j / 12345678)
#   - Neo4j Bolt:    bolt://localhost:7687
# ============================================================

services:
  neo4j:
    image: neo4j:5.26
    container_name: neo4j          # 固定容器名，与 .env / 文档保持一致
    ports:
      - "7474:7474"                # Neo4j Web UI（HTTP）
      - "7687:7687"                # Neo4j Bolt 协议（程序连接）
    environment:
      - NEO4J_AUTH=neo4j/12345678  # 默认用户名/密码
    volumes:
      - neo4j_data:/data           # 数据持久化（容器删除后数据仍保留）
    restart: unless-stopped        # 异常退出自动重启

volumes:
  neo4j_data:
    external: true                 # 复用已存在的同名卷，保留原有知识图谱数据
    name: neo4j_data               # 显式指定卷名（不加项目名前缀），与旧 docker run 一致
